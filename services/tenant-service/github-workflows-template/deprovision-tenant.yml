name: Deprovision Tenant

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: 'Tenant ID to delete'
        required: true
        type: string
      namespace:
        description: 'Kubernetes namespace to delete'
        required: true
        type: string

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}

jobs:
  deprovision:
    name: Deprovision Standard Tier Tenant
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --zone ${{ env.GKE_ZONE }} \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Delete Kubernetes Namespace
        run: |
          kubectl delete namespace ${{ inputs.namespace }} --wait=true || echo "Namespace not found"

      - name: Delete Storage Bucket
        run: |
          gsutil -m rm -r gs://${{ inputs.tenant_id }}-uploads || echo "Bucket not found"

      - name: Delete Identity Platform Tenant
        run: |
          # TODO: Implement Identity Platform tenant deletion
          # gcloud identity platform tenants delete ${{ inputs.tenant_id }} ...
          echo "Identity Platform tenant deletion not yet implemented"

      - name: Clean up IAM Bindings
        run: |
          # TODO: Remove any tenant-specific IAM bindings
          echo "IAM cleanup not yet implemented"

      - name: Report Success
        run: |
          echo "✅ Tenant ${{ inputs.tenant_id }} deprovisioned successfully"

