# Helm values for recommendation-service in enterprise tier (DEV)
# Enterprise uses default namespace in dedicated cluster
namespaceOverride: default

commonLabels:
  app.kubernetes.io/part-of: recommendation-system
  app.kubernetes.io/managed-by: helm
  tier: enterprise
  environment: dev

neo4j:
  name: neo4j
  image: neo4j:5.15.0
  port:
    bolt: 7687
    http: 7474
  replicas: 1
  password: ""  # Set via: --set neo4j.password=your-password
  environmentVariables:
    plugins: '["apoc"]'
    dbmsSecurityProceduresUnrestricted: "apoc.*"
    serverMemoryHeapInitialSize: "256m"
    serverMemoryHeapMaxSize: "512m"
    serverMemoryPagecacheSize: "256m"
  volumeMounts:
    mountPath: /data
    name: neo4j-data
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  probes:
    liveness:
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 5
    readiness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5

neo4jPvc:
  name: neo4j-data-pvc
  storage: 20Gi  # More storage for enterprise

recommendationApi:
  name: recommendation-service
  image: ghcr.io/leotschritter/cad-backend/iaas-476910/recommendation-service:latest
  port: 8080
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  cors:
    # CORS origin will be overridden via --set in pipeline
    # Pattern: https://frontend.{tenant_name}.dev.tripico.fun
    origins: "*"
    methods: "GET,POST,PUT,DELETE,OPTIONS"
    headers: "accept,authorization,content-type,x-requested-with"

  probes:
    startup:
      path: /q/health/started
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 30
      timeoutSeconds: 5
    readiness:
      path: /q/health/ready
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
    liveness:
      path: /q/health/live
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 5

recommendationConfig:
  name: recommendation-service-config
  googleCloudProject: "iaas-476910"
  neo4j:
    uri: "bolt://neo4j-service.default.svc.cluster.local:7687"
    username: "neo4j"
  itineraryServiceUrl: "http://itinerary-service.default.svc.cluster.local:8080"
  identityPlatform:
    authEnabled: "true"
    primaryHeader: "X-Forwarded-Authorization"
    fallbackHeader: "Authorization"
    # Tenant ID for multi-tenancy - set via pipeline from Terraform output
    tenantId: ""  # Will be set via --set recommendationConfig.identityPlatform.tenantId=<tenant_id>
  recommendation:
    feedMaxItems: "50"

recommendationSecret:
  name: recommendation-service-secret

service:
  name: recommendation-service
  type: ClusterIP
  port: 8080
  targetPort: 8080

neo4jService:
  name: neo4j-service
  type: ClusterIP
  boltPort: 7687
  httpPort: 7474

serviceAccount:
  create: true
  name: recommendation-service-sa
  annotations: {}

ingress:
  enabled: true
  prod:
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Host will be set via --set ingress.prod.host in pipeline
    host: ""
    # TLS secret name will be set via --set ingress.prod.tlsSecretName in pipeline
    tlsSecretName: ""

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

