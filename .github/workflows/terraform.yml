name: Terraform

on:
  push:
    branches:
      - main
      - develop
      - feature/tenant-terraform
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
          - validate
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        default: 'free'
        options:
          - free
          - standard
          - enterprise
      tenant_number:
        description: 'Tenant number for standard/enterprise (e.g., 1, 2, 3)'
        required: false
        type: string
        default: '1'
      tenant_name:
        description: 'Custom tenant name for enterprise (e.g., acme-corp). If empty, uses enterprise-{number}'
        required: false
        type: string
        default: ''

env:
  TF_VERSION: '1.14.0'
  GCP_PROJECT_ID: ${{ github.ref_name == 'main' && 'graphite-plane-474510-s9' || 'iaas-476910' }}
  GCP_CREDENTIALS: ${{ github.ref_name == 'main' && secrets.GCP_SERVICE_ACCOUNT_KEY || secrets.GCP_SERVICE_ACCOUNT_KEY_2 }}
  TF_STATE_BUCKET: ${{ github.ref_name == 'main' && 'graphite-plane-474510-s9-terraform-state' || 'iaas-476910-terraform-state' }}
  TF_VAR_project_id: ${{ github.ref_name == 'main' && 'graphite-plane-474510-s9' || 'iaas-476910' }}
  TF_VAR_is_prod_environment: ${{ github.ref_name == 'main' && 'true' || 'false' }}
  TF_VAR_domain_name: ${{ github.ref_name == 'main' && 'tripico.fun' || 'dev.tripico.fun' }}

jobs:
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set environment variables
        id: set-env
        run: |
          # Determine environment and tenant
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TF_ENV="${{ inputs.environment }}"
            TENANT_NUM="${{ inputs.tenant_number }}"
            CUSTOM_TENANT_NAME="${{ inputs.tenant_name }}"
          else
            TF_ENV="free"
            TENANT_NUM="1"
            CUSTOM_TENANT_NAME=""
          fi

          echo "TF_ENV=$TF_ENV" >> $GITHUB_OUTPUT
          echo "TENANT_NUM=$TENANT_NUM" >> $GITHUB_OUTPUT
          echo "WORKING_DIR=terraform/environment/$TF_ENV" >> $GITHUB_OUTPUT

          # Set state prefix and tenant name based on environment
          if [ "$TF_ENV" = "enterprise" ]; then
            # Enterprise tier: use custom tenant name if provided, otherwise enterprise-{number}
            if [ -n "$CUSTOM_TENANT_NAME" ]; then
              TENANT_NAME="$CUSTOM_TENANT_NAME"
            else
              TENANT_NAME="enterprise-${TENANT_NUM}"
            fi
            echo "STATE_PREFIX=terraform/state/${TENANT_NAME}" >> $GITHUB_OUTPUT
            echo "TENANT_NAME=$TENANT_NAME" >> $GITHUB_OUTPUT
            # Enterprise tier: dedicated GKE cluster per tenant
            echo "GKE_CLUSTER_NAME=tripico-${TENANT_NAME}-cluster" >> $GITHUB_OUTPUT
          elif [ "$TF_ENV" = "standard" ]; then
            echo "STATE_PREFIX=terraform/state/standard-${TENANT_NUM}" >> $GITHUB_OUTPUT
            echo "TENANT_NAME=standard-${TENANT_NUM}" >> $GITHUB_OUTPUT
            # Standard tier: uses shared GKE cluster
            echo "GKE_CLUSTER_NAME=tripico-cluster" >> $GITHUB_OUTPUT
          else
            echo "STATE_PREFIX=terraform/state/free" >> $GITHUB_OUTPUT
            echo "TENANT_NAME=free" >> $GITHUB_OUTPUT
            # Free tier: shared GKE cluster
            echo "GKE_CLUSTER_NAME=tripico-cluster" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Init
        working-directory: ${{ steps.set-env.outputs.WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ steps.set-env.outputs.STATE_PREFIX }}"

      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Get GKE credentials (if cluster exists)
        continue-on-error: true
        run: |
          # For enterprise tier, connect to tenant-specific cluster; for others, use shared cluster
          CLUSTER_NAME="${{ steps.set-env.outputs.GKE_CLUSTER_NAME }}"
          echo "Connecting to GKE cluster: $CLUSTER_NAME"
          gcloud container clusters get-credentials "$CLUSTER_NAME" --region europe-west1 --project ${{ env.GCP_PROJECT_ID }} || echo "GKE cluster not yet created"

      - name: Verify kubeconfig setup
        continue-on-error: true
        run: |
          echo "Checking if kubeconfig exists..."
          if [ -f ~/.kube/config ]; then
            echo "✓ kubeconfig file exists at ~/.kube/config"
            echo "Current context:"
            kubectl config current-context || echo "No current context"
            echo "Testing cluster connectivity..."
            kubectl cluster-info || echo "Cannot connect to cluster"
          else
            echo "✗ kubeconfig file does not exist"
          fi

      - name: Terraform Validate
        working-directory: ${{ steps.set-env.outputs.WORKING_DIR }}
        run: terraform validate

      - name: Terraform Format Check
        working-directory: ${{ steps.set-env.outputs.WORKING_DIR }}
        run: terraform fmt -check -recursive

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform-validate
    # Run plan on PRs, pushes, or when manually dispatched with action == 'plan' or 'apply'.
    # The plan is required before apply can run.
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set environment variables
        id: set-env
        run: |
          # Determine environment and tenant
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TF_ENV="${{ inputs.environment }}"
            TENANT_NUM="${{ inputs.tenant_number }}"
            CUSTOM_TENANT_NAME="${{ inputs.tenant_name }}"
          else
            TF_ENV="free"
            TENANT_NUM="1"
            CUSTOM_TENANT_NAME=""
          fi

          echo "TF_ENV=$TF_ENV" >> $GITHUB_OUTPUT
          echo "TENANT_NUM=$TENANT_NUM" >> $GITHUB_OUTPUT
          echo "WORKING_DIR=terraform/environment/$TF_ENV" >> $GITHUB_OUTPUT

          # Set state prefix and tenant name based on environment
          if [ "$TF_ENV" = "enterprise" ]; then
            # Enterprise tier: use custom tenant name if provided, otherwise enterprise-{number}
            if [ -n "$CUSTOM_TENANT_NAME" ]; then
              TENANT_NAME="$CUSTOM_TENANT_NAME"
            else
              TENANT_NAME="enterprise-${TENANT_NUM}"
            fi
            echo "STATE_PREFIX=terraform/state/${TENANT_NAME}" >> $GITHUB_OUTPUT
            echo "TENANT_NAME=$TENANT_NAME" >> $GITHUB_OUTPUT
            # Enterprise tier: dedicated GKE cluster per tenant
            echo "GKE_CLUSTER_NAME=tripico-${TENANT_NAME}-cluster" >> $GITHUB_OUTPUT
          elif [ "$TF_ENV" = "standard" ]; then
            echo "STATE_PREFIX=terraform/state/standard-${TENANT_NUM}" >> $GITHUB_OUTPUT
            echo "TENANT_NAME=standard-${TENANT_NUM}" >> $GITHUB_OUTPUT
            # Standard tier: uses shared GKE cluster
            echo "GKE_CLUSTER_NAME=tripico-cluster" >> $GITHUB_OUTPUT
          else
            echo "STATE_PREFIX=terraform/state/free" >> $GITHUB_OUTPUT
            echo "TENANT_NAME=free" >> $GITHUB_OUTPUT
            # Free tier: shared GKE cluster
            echo "GKE_CLUSTER_NAME=tripico-cluster" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Init
        working-directory: ${{ steps.set-env.outputs.WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ steps.set-env.outputs.STATE_PREFIX }}"

      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Get GKE credentials (if cluster exists)
        continue-on-error: true
        run: |
          # For enterprise tier, connect to tenant-specific cluster; for others, use shared cluster
          CLUSTER_NAME="${{ steps.set-env.outputs.GKE_CLUSTER_NAME }}"
          echo "Connecting to GKE cluster: $CLUSTER_NAME"
          gcloud container clusters get-credentials "$CLUSTER_NAME" --region europe-west1 --project ${{ env.GCP_PROJECT_ID }} || echo "GKE cluster not yet created"

      - name: Verify kubeconfig setup
        continue-on-error: true
        run: |
          echo "Checking if kubeconfig exists..."
          if [ -f ~/.kube/config ]; then
            echo "✓ kubeconfig file exists at ~/.kube/config"
            ls -lh ~/.kube/config
            echo "Current context:"
            kubectl config current-context || echo "No current context"
            echo "Testing cluster connectivity..."
            kubectl cluster-info || echo "Cannot connect to cluster"
            echo "Checking Helm connectivity..."
            helm version || echo "Helm not available"
          else
            echo "✗ kubeconfig file does not exist"
          fi

      - name: Remove problematic Helm release from state (if exists)
        continue-on-error: true
        working-directory: ${{ steps.set-env.outputs.WORKING_DIR }}
        run: |
          echo "Checking if Helm release exists in state..."
          if terraform state list | grep -q "module.dns.helm_release.ingress_nginx"; then
            echo "Found Helm release in state, removing it to allow refresh..."
            terraform state rm module.dns.helm_release.ingress_nginx || echo "Failed to remove, will continue anyway"
          else
            echo "No Helm release found in state"
          fi

      - name: Terraform Plan
        id: tf-plan
        working-directory: ${{ steps.set-env.outputs.WORKING_DIR }}
        env:
          TF_VAR_project_id: ${{ env.GCP_PROJECT_ID }}
          TF_VAR_domain_name: ${{ env.TF_VAR_domain_name }}
          TF_VAR_is_prod_environment: ${{ env.TF_VAR_is_prod_environment }}
          TF_VAR_tenant_name: ${{ steps.set-env.outputs.TENANT_NAME }}
        run: |
          terraform plan -no-color -out=tfplan | tee plan.txt
          echo "plan<<EOF" >> $GITHUB_OUTPUT
          cat plan.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ steps.set-env.outputs.TENANT_NAME }}
          path: terraform/tfplan
          retention-days: 5

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    # Run apply only when a push to main happens (after plan) OR when
    # manually dispatched with action=apply. The job is protected by
    # `environment: production` so you must configure environment approvals
    # in GitHub to require manual approval before the job runs.
    if: (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set environment variables
        id: set-env
        run: |
          # Determine environment and tenant
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TF_ENV="${{ inputs.environment }}"
            TENANT_NUM="${{ inputs.tenant_number }}"
            CUSTOM_TENANT_NAME="${{ inputs.tenant_name }}"
          else
            TF_ENV="free"
            TENANT_NUM="1"
            CUSTOM_TENANT_NAME=""
          fi

          echo "TF_ENV=$TF_ENV" >> $GITHUB_OUTPUT
          echo "TENANT_NUM=$TENANT_NUM" >> $GITHUB_OUTPUT
          echo "WORKING_DIR=terraform/environment/$TF_ENV" >> $GITHUB_OUTPUT

          # Set state prefix and tenant name based on environment
          if [ "$TF_ENV" = "enterprise" ]; then
            # Enterprise tier: use custom tenant name if provided, otherwise enterprise-{number}
            if [ -n "$CUSTOM_TENANT_NAME" ]; then
              TENANT_NAME="$CUSTOM_TENANT_NAME"
            else
              TENANT_NAME="enterprise-${TENANT_NUM}"
            fi
            echo "STATE_PREFIX=terraform/state/${TENANT_NAME}" >> $GITHUB_OUTPUT
            echo "TENANT_NAME=$TENANT_NAME" >> $GITHUB_OUTPUT
            # Enterprise tier: dedicated GKE cluster per tenant
            echo "GKE_CLUSTER_NAME=tripico-${TENANT_NAME}-cluster" >> $GITHUB_OUTPUT
          elif [ "$TF_ENV" = "standard" ]; then
            echo "STATE_PREFIX=terraform/state/standard-${TENANT_NUM}" >> $GITHUB_OUTPUT
            echo "TENANT_NAME=standard-${TENANT_NUM}" >> $GITHUB_OUTPUT
            # Standard tier: uses shared GKE cluster
            echo "GKE_CLUSTER_NAME=tripico-cluster" >> $GITHUB_OUTPUT
          else
            echo "STATE_PREFIX=terraform/state/free" >> $GITHUB_OUTPUT
            echo "TENANT_NAME=free" >> $GITHUB_OUTPUT
            # Free tier: shared GKE cluster
            echo "GKE_CLUSTER_NAME=tripico-cluster" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Init
        working-directory: ${{ steps.set-env.outputs.WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ steps.set-env.outputs.STATE_PREFIX }}"

      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Get GKE credentials (if cluster exists)
        continue-on-error: true
        run: |
          # For enterprise tier, connect to tenant-specific cluster; for others, use shared cluster
          CLUSTER_NAME="${{ steps.set-env.outputs.GKE_CLUSTER_NAME }}"
          echo "Connecting to GKE cluster: $CLUSTER_NAME"
          gcloud container clusters get-credentials "$CLUSTER_NAME" --region europe-west1 --project ${{ env.GCP_PROJECT_ID }} || echo "GKE cluster not yet created"

      - name: Verify kubeconfig setup
        continue-on-error: true
        run: |
          echo "Checking if kubeconfig exists..."
          if [ -f ~/.kube/config ]; then
            echo "✓ kubeconfig file exists at ~/.kube/config"
            ls -lh ~/.kube/config
            echo "Current context:"
            kubectl config current-context || echo "No current context"
            echo "Testing cluster connectivity..."
            kubectl cluster-info || echo "Cannot connect to cluster"
            echo "Checking Helm connectivity..."
            helm version || echo "Helm not available"
          else
            echo "✗ kubeconfig file does not exist"
          fi

      - name: Remove problematic Helm release from state (if exists)
        continue-on-error: true
        working-directory: ${{ steps.set-env.outputs.WORKING_DIR }}
        run: |
          echo "Checking if Helm release exists in state..."
          if terraform state list | grep -q "module.dns.helm_release.ingress_nginx"; then
            echo "Found Helm release in state, removing it to allow refresh..."
            terraform state rm module.dns.helm_release.ingress_nginx || echo "Failed to remove, will continue anyway"
          else
            echo "No Helm release found in state"
          fi

      # Try to download a plan artifact produced by the Plan job. If it's
      # available we'll apply it. If not (e.g. a manual dispatch without a
      # prior plan), fall back to creating a plan and applying it.
      - name: Download Plan Artifact (if present)
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ steps.set-env.outputs.TENANT_NAME }}
          path: terraform
        continue-on-error: true

      - name: Import existing Identity Platform config (all environments)
        working-directory: ${{ steps.set-env.outputs.WORKING_DIR }}
        continue-on-error: true
        env:
          TF_VAR_project_id: ${{ env.GCP_PROJECT_ID }}
          TF_VAR_domain_name: ${{ env.TF_VAR_domain_name }}
          TF_VAR_is_prod_environment: ${{ env.TF_VAR_is_prod_environment }}
          TF_VAR_tenant_name: ${{ steps.set-env.outputs.TENANT_NAME }}
        run: |
          PROJECT_ID="${{ env.GCP_PROJECT_ID }}"
          TF_ENV="${{ steps.set-env.outputs.TF_ENV }}"

          # Identity Platform config - different resource path per environment
          # Free tier: uses module.project.google_identity_platform_config.default
          # Standard/Enterprise: uses google_identity_platform_config.default (no module)
          if [ "$TF_ENV" = "free" ]; then
            RESOURCE_ADDR="module.project.google_identity_platform_config.default"
          else
            RESOURCE_ADDR="google_identity_platform_config.default"
          fi

          # Check if resource is already in Terraform state
          if terraform state list 2>/dev/null | grep -q "^${RESOURCE_ADDR}$"; then
            echo "✅ Identity Platform config already in Terraform state"
            exit 0
          fi

          # Check if Identity Platform is already enabled in GCP
          echo "Checking if Identity Platform is already enabled..."
          if gcloud identity config describe --project="$PROJECT_ID" 2>/dev/null | grep -q "name:"; then
            echo "✅ Identity Platform config exists in GCP, attempting to import..."
            # Try to import with retries
            IMPORT_SUCCESS=false
            for i in 1 2 3; do
              echo "Import attempt $i..."
              if terraform import "$RESOURCE_ADDR" "projects/${PROJECT_ID}/config" 2>&1; then
                echo "✅ Successfully imported Identity Platform config"
                IMPORT_SUCCESS=true
                break
              else
                echo "⚠️ Import attempt $i failed, retrying..."
                sleep 2
              fi
            done
            
            if [ "$IMPORT_SUCCESS" = "false" ]; then
              echo "⚠️ Import failed after 3 attempts"
              echo "Verifying config is in Terraform state..."
              if terraform state list 2>/dev/null | grep -q "^${RESOURCE_ADDR}$"; then
                echo "✅ Config is actually in state (import may have succeeded silently)"
              else
                echo "❌ Config is NOT in state - this may cause tenant creation to fail"
                echo "Terraform will try to create the config, but it already exists - this may cause errors"
              fi
            fi
          else
            echo "Identity Platform config does not exist in GCP, Terraform will create it"
          fi
          
          # Verify the config resource will be available for tenant creation
          echo "Verifying Identity Platform config is ready for tenant creation..."
          terraform state list 2>/dev/null | grep -E "(google_identity_platform_config|module.project.google_identity_platform_config)" || echo "Config not in state yet - will be created/imported during apply"

      - name: Check for existing Identity Platform tenant (standard/enterprise only)
        if: ${{ steps.set-env.outputs.TF_ENV == 'standard' || steps.set-env.outputs.TF_ENV == 'enterprise' }}
        working-directory: ${{ steps.set-env.outputs.WORKING_DIR }}
        continue-on-error: true
        env:
          TF_VAR_project_id: ${{ env.GCP_PROJECT_ID }}
          TF_VAR_domain_name: ${{ env.TF_VAR_domain_name }}
          TF_VAR_is_prod_environment: ${{ env.TF_VAR_is_prod_environment }}
          TF_VAR_tenant_name: ${{ steps.set-env.outputs.TENANT_NAME }}
        run: |
          # Check if tenant is already in Terraform state
          TENANT_IN_STATE=$(terraform state list 2>/dev/null | grep -q "google_identity_platform_tenant.tenant" && echo "true" || echo "false")

          if [ "$TENANT_IN_STATE" = "true" ]; then
            echo "✅ Identity Platform tenant already in Terraform state"
            terraform state show google_identity_platform_tenant.tenant | grep -E "(id|name|display_name)" || true
          else
            # Determine the expected display name
            if [ "${{ steps.set-env.outputs.TF_ENV }}" = "enterprise" ]; then
              TENANT_PREFIX="ent"
            else
              TENANT_PREFIX="std"
            fi
            EXPECTED_DISPLAY_NAME="${TENANT_PREFIX}-${{ steps.set-env.outputs.TENANT_NAME }}"
            
            echo "Identity Platform tenant not in state"
            echo "Expected display name: ${EXPECTED_DISPLAY_NAME}"
            echo "Terraform will create the tenant if it doesn't exist"
            
            # Try to find existing tenant by display name (for reference only, don't import)
            # Identity Platform tenant IDs are auto-generated, so we can't reliably import by ID
            # Terraform will create it if it doesn't exist, or update it if it does
            echo "Note: Identity Platform tenant IDs are auto-generated by GCP"
            echo "Terraform will create a new tenant with display_name: ${EXPECTED_DISPLAY_NAME}"
          fi

      - name: Apply plan (use artifact if present, otherwise create+apply)
        working-directory: ${{ steps.set-env.outputs.WORKING_DIR }}
        env:
          TF_VAR_project_id: ${{ env.GCP_PROJECT_ID }}
          TF_VAR_domain_name: ${{ env.TF_VAR_domain_name }}
          TF_VAR_is_prod_environment: ${{ env.TF_VAR_is_prod_environment }}
          TF_VAR_tenant_name: ${{ steps.set-env.outputs.TENANT_NAME }}
        run: |
          if [ -f tfplan ]; then
            echo "Found uploaded plan artifact; applying it"
            terraform apply -auto-approve tfplan
          else
            echo "No plan artifact found; running plan then apply"
            terraform plan -out=tfplan
            terraform apply -auto-approve tfplan
          fi

      - name: Terraform Outputs
        id: tf-outputs
        working-directory: ${{ steps.set-env.outputs.WORKING_DIR }}
        run: |
          echo "api_gateway_url=$(terraform output -raw api_gateway_url)" >> $GITHUB_OUTPUT
          # GKE cluster name exists in free and enterprise tiers (they create clusters)
          if [ "${{ steps.set-env.outputs.TF_ENV }}" = "free" ] || [ "${{ steps.set-env.outputs.TF_ENV }}" = "enterprise" ]; then
            echo "gke_cluster_name=$(terraform output -raw gke_cluster_name)" >> $GITHUB_OUTPUT
          fi
          # Tenant name exists in standard and enterprise tiers
          if [ "${{ steps.set-env.outputs.TF_ENV }}" = "standard" ] || [ "${{ steps.set-env.outputs.TF_ENV }}" = "enterprise" ]; then
            echo "tenant_name=$(terraform output -raw tenant_name)" >> $GITHUB_OUTPUT
          fi

      - name: Verify Identity Platform tenant was created (standard/enterprise only)
        if: ${{ steps.set-env.outputs.TF_ENV == 'standard' || steps.set-env.outputs.TF_ENV == 'enterprise' }}
        working-directory: ${{ steps.set-env.outputs.WORKING_DIR }}
        continue-on-error: true
        env:
          TF_VAR_project_id: ${{ env.GCP_PROJECT_ID }}
          TF_VAR_tenant_name: ${{ steps.set-env.outputs.TENANT_NAME }}
        run: |
          echo "Verifying Identity Platform tenant was created..."
          
          # Check if tenant is in Terraform state
          if terraform state list 2>/dev/null | grep -q "google_identity_platform_tenant.tenant"; then
            echo "✅ Identity Platform tenant is in Terraform state"
            terraform state show google_identity_platform_tenant.tenant | head -20
          else
            echo "❌ ERROR: Identity Platform tenant is NOT in Terraform state!"
            echo "This means the tenant was not created by Terraform."
            exit 1
          fi
          
          # Get the tenant ID from Terraform output
          TENANT_ID=$(terraform output -raw identity_platform_tenant_id 2>/dev/null || echo "")
          if [ -n "$TENANT_ID" ]; then
            echo "✅ Identity Platform tenant ID from Terraform: $TENANT_ID"
            
            # Verify tenant exists in GCP
            if gcloud identity tenants describe "$TENANT_ID" --project="${{ env.GCP_PROJECT_ID }}" 2>/dev/null; then
              echo "✅ Verified: Identity Platform tenant exists in GCP"
            else
              echo "⚠️ WARNING: Tenant ID exists in Terraform but could not be verified in GCP"
            fi
          else
            echo "❌ ERROR: Could not retrieve tenant ID from Terraform outputs!"
            exit 1
          fi

      - name: Export Terraform outputs as JSON
        working-directory: ${{ steps.set-env.outputs.WORKING_DIR }}
        run: |
          terraform output -json > tf-outputs.json

      - name: Upload Terraform outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ steps.set-env.outputs.TENANT_NAME }}
          path: ${{ steps.set-env.outputs.WORKING_DIR }}/tf-outputs.json

  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set environment variables
        id: set-env
        run: |
          # Determine environment and tenant
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TF_ENV="${{ inputs.environment }}"
            TENANT_NUM="${{ inputs.tenant_number }}"
            CUSTOM_TENANT_NAME="${{ inputs.tenant_name }}"
          else
            TF_ENV="free"
            TENANT_NUM="1"
            CUSTOM_TENANT_NAME=""
          fi

          echo "TF_ENV=$TF_ENV" >> $GITHUB_OUTPUT
          echo "TENANT_NUM=$TENANT_NUM" >> $GITHUB_OUTPUT
          echo "WORKING_DIR=terraform/environment/$TF_ENV" >> $GITHUB_OUTPUT

          # Set state prefix and tenant name based on environment
          if [ "$TF_ENV" = "enterprise" ]; then
            # Enterprise tier: use custom tenant name if provided, otherwise enterprise-{number}
            if [ -n "$CUSTOM_TENANT_NAME" ]; then
              TENANT_NAME="$CUSTOM_TENANT_NAME"
            else
              TENANT_NAME="enterprise-${TENANT_NUM}"
            fi
            echo "STATE_PREFIX=terraform/state/${TENANT_NAME}" >> $GITHUB_OUTPUT
            echo "TENANT_NAME=$TENANT_NAME" >> $GITHUB_OUTPUT
            # Enterprise tier: dedicated GKE cluster per tenant
            echo "GKE_CLUSTER_NAME=tripico-${TENANT_NAME}-cluster" >> $GITHUB_OUTPUT
          elif [ "$TF_ENV" = "standard" ]; then
            echo "STATE_PREFIX=terraform/state/standard-${TENANT_NUM}" >> $GITHUB_OUTPUT
            echo "TENANT_NAME=standard-${TENANT_NUM}" >> $GITHUB_OUTPUT
            # Standard tier: uses shared GKE cluster
            echo "GKE_CLUSTER_NAME=tripico-cluster" >> $GITHUB_OUTPUT
          else
            echo "STATE_PREFIX=terraform/state/free" >> $GITHUB_OUTPUT
            echo "TENANT_NAME=free" >> $GITHUB_OUTPUT
            # Free tier: shared GKE cluster
            echo "GKE_CLUSTER_NAME=tripico-cluster" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Init
        working-directory: ${{ steps.set-env.outputs.WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ steps.set-env.outputs.STATE_PREFIX }}"

      - name: Terraform Destroy
        working-directory: ${{ steps.set-env.outputs.WORKING_DIR }}
        env:
          TF_VAR_project_id: ${{ env.GCP_PROJECT_ID }}
          TF_VAR_domain_name: ${{ env.TF_VAR_domain_name }}
          TF_VAR_is_prod_environment: ${{ env.TF_VAR_is_prod_environment }}
          TF_VAR_tenant_name: ${{ steps.set-env.outputs.TENANT_NAME }}
        run: terraform destroy -auto-approve

