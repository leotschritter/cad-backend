# Helm values for comments-likes-service in enterprise tier (PROD)
# Enterprise uses default namespace in dedicated cluster
namespaceOverride: default

replicaCount: 2

image:
  repository: europe-west1-docker.pkg.dev/graphite-plane-474510-s9/docker-repo/comments-likes-service
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

commentsLikesService:
  cors:
    origins: "*"
    methods: "GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD"
    headers: "accept,authorization,content-type,x-requested-with,cache-control,if-modified-since"

serviceAccount:
  create: true
  name: "comments-likes-sa"
  annotations:
    iam.gke.io/gcp-service-account: "tripico-sa@graphite-plane-474510-s9.iam.gserviceaccount.com"

gcp:
  projectId: "graphite-plane-474510-s9"
  serviceAccountEmail: "tripico-sa@graphite-plane-474510-s9.iam.gserviceaccount.com"

backendUrl: "https://cl-enterprise.tripico.fun"

podAnnotations:
  tier: enterprise
  environment: prod

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  name: http

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  # Host will be set via --set ingress.host in pipeline
  host: ""
  # TLS secret name will be set via --set ingress.tlsSecretName in pipeline
  tlsSecretName: ""

resources:
  limits:
    cpu: 1000m    # Enterprise tier gets more resources
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# Quarkus application configuration
quarkus:
  http:
    port: 8080
    host: "0.0.0.0"
  profile: "prod"

# Identity Platform Authentication Configuration
identityPlatform:
  authEnabled: "true"
  primaryHeader: "X-Forwarded-Authorization"
  fallbackHeader: "Authorization"

# Service discovery - Enterprise has dedicated services in same cluster
sharedServices:
  weatherService:
    url: "http://weather-forecast-service.default.svc.cluster.local:8080"
  travelWarningsService:
    url: "http://travel-warnings-service.default.svc.cluster.local:8080"

# Health check probes
probes:
  startup:
    httpGet:
      path: /q/health/started
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  liveness:
    httpGet:
      path: /q/health/live
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
  readiness:
    httpGet:
      path: /q/health/ready
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5

nodeSelector: {}

tolerations: []

affinity: {}

