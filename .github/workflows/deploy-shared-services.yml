name: Deploy Shared Services (Weather & Travel Warnings)

on:
  push:
    branches:
      - main
      - develop
      - feature/namespaces-01
    paths:
      - 'services/weather-forecast-service/**'
      - 'services/travel_warnings/**'
      - '.github/workflows/deploy-shared-services.yml'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Which tier to deploy to'
        required: true
        type: choice
        options:
          - shared
          - enterprise
        default: shared
      enterprise_name:
        description: 'Enterprise tenant name (only for enterprise tier, e.g., acme-corp)'
        required: false
        type: string
        default: ''
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - prod
          - dev
        default: dev
  repository_dispatch:
    types: [deploy-shared-services]

jobs:
  setup-namespace:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && (inputs.environment == 'prod' && 'production' || 'develop') || github.event_name == 'repository_dispatch' && (github.event.client_payload.environment == 'prod' && 'production' || 'develop') || (github.ref_name == 'main' && 'production' || 'develop') }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install GKE Auth Plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Get GKE Credentials
        env:
          ENTERPRISE_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.enterprise_name || github.event.client_payload.enterprise_name || '' }}
          TIER: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || github.event.client_payload.tier || 'shared' }}
        run: |
          # For enterprise tier, use dedicated cluster; for shared tier, use shared cluster
          if [ "$TIER" = "enterprise" ] && [ -n "$ENTERPRISE_NAME" ]; then
            CLUSTER_NAME="tripico-${ENTERPRISE_NAME}-cluster"
            echo "Deploying to enterprise cluster: $CLUSTER_NAME"
          else
            CLUSTER_NAME="tripico-cluster"
            echo "Deploying to shared cluster: $CLUSTER_NAME"
          fi
          
          gcloud container clusters get-credentials $CLUSTER_NAME \
            --region europe-west1 \
            --project ${{ vars.PROJECT_ID }}

      - name: Create Shared Namespace
        run: |
          echo "Creating shared namespace..."
          kubectl apply -f infrastructure/kubernetes/namespaces/namespaces.yaml

          echo "Waiting for shared namespace to be ready..."
          kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/shared --timeout=60s

          echo "Shared namespace ready"

      - name: Apply Network Policies
        run: |
          echo "Applying network policies..."
          kubectl apply -f infrastructure/kubernetes/namespaces/network-policies.yaml
          echo "Network policies applied successfully"

  deploy-shared-services:
    needs: setup-namespace
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && (inputs.environment == 'prod' && 'production' || 'develop') || github.event_name == 'repository_dispatch' && (github.event.client_payload.environment == 'prod' && 'production' || 'develop') || (github.ref_name == 'main' && 'production' || 'develop') }}
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        service:
          - name: weather-forecast
            chart: services/weather-forecast-service/helm/weather-forecast-service
            values_dev: services/weather-forecast-service/helm/weather-forecast-service/values-shared-dev.yaml
            values_prod: services/weather-forecast-service/helm/weather-forecast-service/values-shared-prod.yaml
            domain_dev: "weather.dev.tripico.fun"
            domain_prod: "weather.tripico.fun"
          - name: travel-warnings
            chart: services/travel_warnings/travel-warnings-chart
            values_dev: services/travel_warnings/travel-warnings-chart/values-shared-dev.yaml
            values_prod: services/travel_warnings/travel-warnings-chart/values-shared-prod.yaml
            domain_dev: "warnings.dev.tripico.fun"
            domain_prod: "warnings.tripico.fun"

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install GKE Auth Plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Get GKE Credentials
        env:
          ENTERPRISE_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.enterprise_name || github.event.client_payload.enterprise_name || '' }}
          TIER: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || github.event.client_payload.tier || 'shared' }}
        run: |
          # For enterprise tier, use dedicated cluster; for shared tier, use shared cluster
          if [ "$TIER" = "enterprise" ] && [ -n "$ENTERPRISE_NAME" ]; then
            CLUSTER_NAME="tripico-${ENTERPRISE_NAME}-cluster"
            echo "Deploying to enterprise cluster: $CLUSTER_NAME"
          else
            CLUSTER_NAME="tripico-cluster"
            echo "Deploying to shared cluster: $CLUSTER_NAME"
          fi
          
          gcloud container clusters get-credentials $CLUSTER_NAME \
            --region europe-west1 \
            --project ${{ vars.PROJECT_ID }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.13.0'

      - name: Deploy ${{ matrix.service.name }} to shared namespace
        env:
          DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.client_payload.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}
          ENTERPRISE_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.enterprise_name || github.event.client_payload.enterprise_name || '' }}
          TIER: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || github.event.client_payload.tier || 'shared' }}
        run: |
          VALUES_FILE=${{ matrix.service.values_dev }}
          DOMAIN=${{ matrix.service.domain_dev }}

          if [ "$DEPLOY_ENV" = "prod" ]; then
            VALUES_FILE=${{ matrix.service.values_prod }}
            DOMAIN=${{ matrix.service.domain_prod }}
          fi

          # Update domain for enterprise tier
          if [ "$TIER" = "enterprise" ] && [ -n "$ENTERPRISE_NAME" ]; then
            # For enterprise: weather-{tenant}.dev.tripico.fun or warnings-{tenant}.dev.tripico.fun
            SERVICE_PREFIX="${{ matrix.service.name }}"
            if [ "$DEPLOY_ENV" = "prod" ]; then
              DOMAIN="${SERVICE_PREFIX}-${ENTERPRISE_NAME}.tripico.fun"
            else
              DOMAIN="${SERVICE_PREFIX}-${ENTERPRISE_NAME}.dev.tripico.fun"
            fi
            echo "Enterprise domain: $DOMAIN"
          fi

          # Build CORS origins
          if [ "$TIER" = "enterprise" ] && [ -n "$ENTERPRISE_NAME" ]; then
            # For enterprise: allow only that tenant's frontend
            if [ "$DEPLOY_ENV" = "prod" ]; then
              CORS_ORIGINS="https://frontend-${ENTERPRISE_NAME}.tripico.fun"
            else
              CORS_ORIGINS="https://frontend-${ENTERPRISE_NAME}.dev.tripico.fun"
            fi
          else
            # For shared tier: use regex pattern for all tenants (freemium + standard-*)
            # Quarkus interprets URLs enclosed in forward slashes as regex
            if [ "$DEPLOY_ENV" = "prod" ]; then
              CORS_ORIGINS="/https://frontend-(freemium|standard-[0-9]+)\\.tripico\\.fun/"
            else
              CORS_ORIGINS="/https://frontend-(freemium|standard-[0-9]+)\\.dev\\.tripico\\.fun/"
            fi
          fi

          echo "Deploying ${{ matrix.service.name }} to shared namespace"
          echo "Tier: $TIER"
          echo "Environment: $DEPLOY_ENV"
          echo "Values file: $VALUES_FILE"
          echo "Domain: $DOMAIN"
          echo "CORS Origins: $CORS_ORIGINS"

          # Build common helm arguments
          HELM_ARGS="--namespace shared --create-namespace --values $VALUES_FILE"
          HELM_ARGS="$HELM_ARGS --set ingress.prod.host=$DOMAIN"
          HELM_ARGS="$HELM_ARGS --set ingress.prod.tlsSecretName=${{ matrix.service.name }}-tls"

          # Add service-specific secrets and CORS configuration
          if [ "${{ matrix.service.name }}" = "weather-forecast" ]; then
            HELM_ARGS="$HELM_ARGS --set meteosource.apiKey=${{ secrets.METEOSOURCE_API_KEY }}"
            # Optionally override image with vars.PROJECT_ID
            HELM_ARGS="$HELM_ARGS --set weatherForecastApi.image=europe-west1-docker.pkg.dev/${{ vars.PROJECT_ID }}/docker-repo/weather-forecast-service:latest"
            # Set CORS origins for weather-forecast
            HELM_ARGS="$HELM_ARGS --set weatherForecastApi.cors.origins=$CORS_ORIGINS"
          elif [ "${{ matrix.service.name }}" = "travel-warnings" ]; then
            HELM_ARGS="$HELM_ARGS --set smtp.user=${{ secrets.SMTP_USER }}"
            HELM_ARGS="$HELM_ARGS --set smtp.password=${{ secrets.SMTP_PASSWORD }}"
            # Optionally override image with vars.PROJECT_ID
            HELM_ARGS="$HELM_ARGS --set travelWarningsApi.image=europe-west1-docker.pkg.dev/${{ vars.PROJECT_ID }}/docker-repo/travel-warnings:latest"
            # Set CORS origins for travel-warnings
            HELM_ARGS="$HELM_ARGS --set travelWarningsApi.cors.origins=$CORS_ORIGINS"
          fi

          helm upgrade --install ${{ matrix.service.name }} ${{ matrix.service.chart }} \
            $HELM_ARGS \
            --wait \
            --timeout 10m

  verify-deployment:
    needs: deploy-shared-services
    if: always() && needs.deploy-shared-services.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && (inputs.environment == 'prod' && 'production' || 'develop') || github.event_name == 'repository_dispatch' && (github.event.client_payload.environment == 'prod' && 'production' || 'develop') || (github.ref_name == 'main' && 'production' || 'develop') }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install GKE Auth Plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Get GKE Credentials
        env:
          ENTERPRISE_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.enterprise_name || github.event.client_payload.enterprise_name || '' }}
          TIER: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || github.event.client_payload.tier || 'shared' }}
        run: |
          # For enterprise tier, use dedicated cluster; for shared tier, use shared cluster
          if [ "$TIER" = "enterprise" ] && [ -n "$ENTERPRISE_NAME" ]; then
            CLUSTER_NAME="tripico-${ENTERPRISE_NAME}-cluster"
            echo "Verifying on enterprise cluster: $CLUSTER_NAME"
          else
            CLUSTER_NAME="tripico-cluster"
            echo "Verifying on shared cluster: $CLUSTER_NAME"
          fi
          
          gcloud container clusters get-credentials $CLUSTER_NAME \
            --region europe-west1 \
            --project ${{ vars.PROJECT_ID }}

      - name: Verify Shared Services Deployment
        run: |
          echo "========== SHARED NAMESPACE =========="
          kubectl get all -n shared
          echo ""
          echo "========== INGRESSES =========="
          kubectl get ingress -n shared
          echo ""
          echo "========== CERTIFICATES =========="
          kubectl get certificate -n shared
          echo ""
          echo "========== PODS DETAILS =========="
          kubectl get pods -n shared -o wide
          echo ""
          echo "========== SERVICES =========="
          kubectl get svc -n shared
