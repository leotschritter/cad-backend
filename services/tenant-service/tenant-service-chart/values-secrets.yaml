# Secret values for tenant-service deployment
# This file contains sensitive information and should NOT be committed to version control
# Add this file to .gitignore

identityPlatform:
  apiKey: "AIzaSyDYw85Zd3NYXOBynENrRI-Ix7BXzS_ZSag"

# MongoDB Configuration (with authentication)
mongodb:
  enabled: true
  serviceName: mongodb-service
  replicaCount: 1
  image:
    repository: mongo
    tag: "7.0"
    pullPolicy: IfNotPresent
  database: tenant_db
  # Connection string with authentication and retryWrites disabled for standalone mode
  connectionString: "mongodb://admin:CHANGE_ME_IN_PRODUCTION@mongodb-service:27017?retryWrites=false"
  
  # MongoDB credentials (already exists as separate secret)
  auth:
    enabled: true
    rootUsername: admin
    rootPassword: CHANGE_ME_IN_PRODUCTION

# GitHub Actions Configuration
github:
  # GitHub personal access token with workflow permissions
  token: "YOUR_GITHUB_TOKEN_HERE"
  repository:
    owner: "leotschritter"
    name: "cad-backend"
    branch: "main"
  frontend:
    owner: "leotschritter"
    name: "cad-frontend"
    branch: "main"

# SMTP Configuration for email notifications
smtp:
  from: "noreply.tenant@htwg-konstanz.de"
  host: "smtp.htwg-konstanz.de"
  port: "587"
  startTls: "REQUIRED"
  user: "YOUR_SMTP_USERNAME"
  password: "YOUR_SMTP_PASSWORD"

# GCP Configuration
gcp:
  projectId: "graphite-plane-474510-s9"
  serviceAccountEmail: "tripico-sa@graphite-plane-474510-s9.iam.gserviceaccount.com"

# Tenant Configuration
tenant:
  baseDomain: "tripico.fun"
  pollingIntervalSeconds: "30"
  environment: "prod"
  cluster: "tripico-cluster"

# Backend URL (API Gateway)
backendUrl: "https://api.tripico.fun"
