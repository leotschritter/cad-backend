name: Provision Tenant

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: 'Sanitized tenant ID (e.g., acme-corp)'
        required: true
        type: string
      namespace:
        description: 'Kubernetes namespace (e.g., tenant-acme-corp)'
        required: true
        type: string
      subdomain:
        description: 'Full subdomain (e.g., acme-corp.tripico.fun)'
        required: true
        type: string
      owner_email:
        description: 'Email of tenant owner'
        required: true
        type: string

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}

jobs:
  provision:
    name: Provision Standard Tier Tenant
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --zone ${{ env.GKE_ZONE }} \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Create Kubernetes namespace
        run: |
          kubectl create namespace ${{ inputs.namespace }} || echo "Namespace already exists"
          kubectl label namespace ${{ inputs.namespace }} tenant-id=${{ inputs.tenant_id }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.13.0'

      - name: Provision Databases
        run: |
          # PostgreSQL for itinerary service
          helm upgrade --install ${{ inputs.tenant_id }}-itinerary-postgres \
            bitnami/postgresql \
            --namespace ${{ inputs.namespace }} \
            --set auth.username=postgres \
            --set auth.password=${{ secrets.POSTGRES_PASSWORD }} \
            --set auth.database=itinerary_db \
            --wait

          # PostgreSQL for weather service
          helm upgrade --install ${{ inputs.tenant_id }}-weather-postgres \
            bitnami/postgresql \
            --namespace ${{ inputs.namespace }} \
            --set auth.username=postgres \
            --set auth.password=${{ secrets.POSTGRES_PASSWORD }} \
            --set auth.database=weather_db \
            --wait

          # PostgreSQL for warnings service
          helm upgrade --install ${{ inputs.tenant_id }}-warnings-postgres \
            bitnami/postgresql \
            --namespace ${{ inputs.namespace }} \
            --set auth.username=postgres \
            --set auth.password=${{ secrets.POSTGRES_PASSWORD }} \
            --set auth.database=warnings_db \
            --wait

          # Neo4j for recommendations
          helm upgrade --install ${{ inputs.tenant_id }}-neo4j \
            neo4j/neo4j \
            --namespace ${{ inputs.namespace }} \
            --set neo4j.password=${{ secrets.NEO4J_PASSWORD }} \
            --wait

      - name: Create Storage Bucket
        run: |
          gsutil mb -p ${{ env.GCP_PROJECT_ID }} \
            -l ${{ env.GKE_ZONE }} \
            gs://${{ inputs.tenant_id }}-uploads || echo "Bucket already exists"

      - name: Deploy Microservices
        run: |
          # Deploy all services to tenant namespace
          # Itinerary Service
          helm upgrade --install itinerary-service \
            ./services/itinerary-service/kubernetes/itinerary-service-chart \
            --namespace ${{ inputs.namespace }} \
            --set postgresql.host=${{ inputs.tenant_id }}-itinerary-postgres \
            --wait

          # Weather Service
          helm upgrade --install weather-service \
            ./services/weather-forecast-service/helm/weather-service-chart \
            --namespace ${{ inputs.namespace }} \
            --set postgresql.host=${{ inputs.tenant_id }}-weather-postgres \
            --wait

          # Travel Warnings Service
          helm upgrade --install warnings-service \
            ./services/travel_warnings/travel-warnings-chart \
            --namespace ${{ inputs.namespace }} \
            --set postgresql.host=${{ inputs.tenant_id }}-warnings-postgres \
            --wait

          # Recommendation Service
          helm upgrade --install recommendation-service \
            ./services/recommendation-service/recommendation-service-chart \
            --namespace ${{ inputs.namespace }} \
            --set neo4j.host=${{ inputs.tenant_id }}-neo4j \
            --wait

          # Comments & Likes Service
          helm upgrade --install comments-likes-service \
            ./services/comments-likes-service/comments-likes-chart \
            --namespace ${{ inputs.namespace }} \
            --wait

      - name: Configure Ingress
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ${{ inputs.tenant_id }}-ingress
            namespace: ${{ inputs.namespace }}
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
          spec:
            ingressClassName: nginx
            tls:
              - hosts:
                  - ${{ inputs.subdomain }}
                secretName: ${{ inputs.tenant_id }}-tls
            rules:
              - host: ${{ inputs.subdomain }}
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: itinerary-service
                          port:
                            number: 8080
          EOF

      - name: Create Identity Platform Tenant
        run: |
          # TODO: Implement Identity Platform tenant creation
          # gcloud identity platform tenants create ${{ inputs.tenant_id }} ...
          echo "Identity Platform tenant creation not yet implemented"

      - name: Create Identity Platform User
        run: |
          # TODO: Implement user creation in Identity Platform tenant
          # Use owner_email and password from tenant service
          echo "Identity Platform user creation not yet implemented"

      - name: Verify Deployment
        run: |
          kubectl wait --for=condition=ready pod \
            --all \
            --namespace ${{ inputs.namespace }} \
            --timeout=600s

      - name: Report Success
        run: |
          echo "✅ Tenant ${{ inputs.tenant_id }} provisioned successfully"
          echo "Frontend URL: https://${{ inputs.subdomain }}"
          echo "Owner Email: ${{ inputs.owner_email }}"

