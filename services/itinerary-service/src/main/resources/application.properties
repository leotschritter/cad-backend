# CORS Configuration (permissive - API Gateway handles external CORS)
# Note: CORS configuration must be in application.properties (not application.yaml) to work properly in Quarkus
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,cache-control,if-modified-since,x-forwarded-authorization,origin
quarkus.http.cors.exposed-headers=content-type,content-length,etag
quarkus.http.cors.access-control-max-age=24H
