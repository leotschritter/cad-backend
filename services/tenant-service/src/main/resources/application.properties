# Application Configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Application Info
quarkus.application.name=tenant-service
quarkus.application.version=1.0.0

# Logging
quarkus.log.level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

# OpenAPI / Swagger
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.smallrye-openapi.path=/q/openapi

# Explicitly enable Swagger UI in production (always-include is sufficient)
%prod.quarkus.swagger-ui.always-include=true

# Health checks
quarkus.smallrye-health.root-path=/q/health

# CORS (adjust as needed for your frontend)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=content-disposition

# Jackson
quarkus.jackson.fail-on-unknown-properties=false
quarkus.jackson.write-dates-as-timestamps=false

# MongoDB Configuration
# Note: retryWrites=false is required for standalone MongoDB (not replica set)
# Local development (docker-compose)
%local.quarkus.mongodb.connection-string=${MONGODB_CONNECTION_STRING:mongodb://localhost:27017?retryWrites=false}
%local.quarkus.mongodb.database=${MONGODB_DATABASE:tenant_db}

# Dev profile
%dev.quarkus.mongodb.connection-string=${MONGODB_CONNECTION_STRING:mongodb://localhost:27017?retryWrites=false}
%dev.quarkus.mongodb.database=${MONGODB_DATABASE:tenant_db}

# Production (Kubernetes)
%prod.quarkus.mongodb.connection-string=${MONGODB_CONNECTION_STRING:mongodb://mongodb-service:27017?retryWrites=false}
%prod.quarkus.mongodb.database=${MONGODB_DATABASE:tenant_db}

# MongoDB health check
quarkus.mongodb.health.enabled=true

# Google Cloud Configuration
%prod.gcp.project-id=${PROJECT_ID:}
%prod.gcp.service-account-email=${SERVICE_ACCOUNT_EMAIL:}

# Firestore Emulator Configuration (for local development)
%dev.gcp.project-id=local-dev-project
%dev.firestore.emulator.host=localhost:8081
%dev.use-firestore-emulator=true

%local.gcp.project-id=${PROJECT_ID:local-dev-project}
%local.firestore.emulator.host=localhost:8081
%local.use-firestore-emulator=${USE_FIRESTORE_EMULATOR:true}

# Identity Platform / Firebase Authentication
%prod.identity-platform.auth.enabled=${IDENTITY_PLATFORM_AUTH_ENABLED:true}
%prod.identity-platform.auth.primary-header=${IDENTITY_PLATFORM_AUTH_PRIMARY_HEADER:X-Forwarded-Authorization}
%prod.identity-platform.auth.fallback-header=${IDENTITY_PLATFORM_AUTH_FALLBACK_HEADER:Authorization}

%dev.identity-platform.auth.enabled=false
%local.identity-platform.auth.enabled=${IDENTITY_PLATFORM_AUTH_ENABLED:false}

# Identity Platform API Configuration (for user creation)
identity-platform.api-key=${IDENTITY_PLATFORM_API_KEY:AIzaSyBOtz34zx7rMs9ZLtiTUnYNhSd4T2fnMXY}

# Mailer Configuration (SMTP)
quarkus.mailer.from=${SMTP_FROM:noreply.tenant@htwg-konstanz.de}
quarkus.mailer.host=${SMTP_HOST:smtp.htwg-konstanz.de}
quarkus.mailer.port=${SMTP_PORT:587}
quarkus.mailer.username=${SMTP_USER:}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.start-tls=${SMTP_START_TLS:REQUIRED}
quarkus.mailer.auth-methods=DIGEST-MD5 CRAM-SHA256 CRAM-SHA1 CRAM-MD5 PLAIN LOGIN
# Mock email in dev mode
%dev.quarkus.mailer.mock=true
%local.quarkus.mailer.mock=true
%prod.quarkus.mailer.mock=false

# GitHub Actions Configuration (Backend Repository)
github.api.base-url=https://api.github.com
github.api.token=${GITHUB_TOKEN:}
github.repository.owner=${GITHUB_REPO_OWNER:}
github.repository.name=${GITHUB_REPO_NAME:}
github.branch=${GITHUB_BRANCH:main}

# GitHub Frontend Repository Configuration
github.frontend.repository.owner=${GITHUB_FRONTEND_REPO_OWNER:}
github.frontend.repository.name=${GITHUB_FRONTEND_REPO_NAME:}
github.frontend.branch=${GITHUB_FRONTEND_BRANCH:main}

# Tenant Configuration
tenant.base-domain=${TENANT_BASE_DOMAIN:tripico.fun}
tenant.polling.interval=${TENANT_POLLING_INTERVAL_SECONDS:30}
tenant.environment=${TENANT_ENVIRONMENT:prod}
tenant.cluster=${TENANT_CLUSTER:tripico-cluster}

# GCP Configuration
gcp.project-id=${PROJECT_ID:}

# Scheduler Configuration
quarkus.scheduler.enabled=true

# REST Client Configuration - GitHub API
quarkus.rest-client.github-api.url=${github.api.base-url}
quarkus.rest-client.github-api.scope=jakarta.inject.Singleton

